name: Debug TT Leagues

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'confirm / dump-sample (event/history+view) / dump-finished-sample (finished match event/view, checks timeline for 1st Game Winner feasibility)'
        required: true
        default: 'confirm'
        type: choice
        options:
          - confirm
          - dump-sample
          - dump-finished-sample
      league_id:
        description: 'For dump-sample / dump-finished-sample: a league_id (e.g. 22307)'
        required: false
        default: ''
      day:
        description: 'For dump-sample / dump-finished-sample: YYYYMMDD, defaults to today (dump-finished-sample falls back to yesterday automatically if nothing finished yet)'
        required: false
        default: ''

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Raw connectivity check (curl, bypasses Python/requests entirely)
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        # Confirmed working from a phone/home network with this same token,
        # but Python's requests library times out on every attempt from
        # GitHub Actions. This isolates WHERE the problem actually is:
        # if curl also hangs here, it's GitHub Actions' network/IP being
        # blocked by BetsAPI; if curl succeeds, the problem is specific to
        # requests' TLS/connection handling in this environment instead.
        run: |
          echo "--- api.b365api.com ---"
          curl -sS -m 20 -w "\nHTTP %{http_code} in %{time_total}s\n" \
            "https://api.b365api.com/v3/league?token=${BETSAPI_TOKEN}&sport_id=92" || echo "curl failed/timed out"
          echo "--- api.betsapi.com ---"
          curl -sS -m 20 -w "\nHTTP %{http_code} in %{time_total}s\n" \
            "https://api.betsapi.com/v3/league?token=${BETSAPI_TOKEN}&sport_id=92" || echo "curl failed/timed out"

      - name: Confirm table-tennis league ids
        if: ${{ github.event.inputs.mode == 'confirm' }}
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: python3 debug_tt_leagues.py --confirm

      - name: Dump a sample response
        if: ${{ github.event.inputs.mode == 'dump-sample' }}
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: python3 debug_tt_leagues.py --dump-sample "${{ github.event.inputs.league_id }}" ${{ github.event.inputs.day }}

      - name: Dump a finished-match sample (checks timeline for 1st Game Winner feasibility)
        if: ${{ github.event.inputs.mode == 'dump-finished-sample' }}
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: python3 debug_tt_leagues.py --dump-finished-sample "${{ github.event.inputs.league_id }}" ${{ github.event.inputs.day }}

      - name: Upload sample JSON (dump-sample mode only)
        if: ${{ github.event.inputs.mode == 'dump-sample' }}
        uses: actions/upload-artifact@v4
        with:
          name: spin-line-sample
          path: spin_line_sample_*.json
          if-no-files-found: warn

      - name: Upload finished-sample JSON (dump-finished-sample mode only)
        if: ${{ github.event.inputs.mode == 'dump-finished-sample' }}
        uses: actions/upload-artifact@v4
        with:
          name: spin-line-finished-sample
          path: spin_line_finished_sample_*.json
          if-no-files-found: warn
