name: Spin Line

on:
  schedule:
    # CONFIRMED (2026-10-03, user screenshots): Setka Cup / TT Cup / Czech
    # Liga Pro / TT Elite Series run as rapid studio matches all day, with
    # the same small player pool cycling through back-to-back rounds
    # (~2hrs apart) -- BetsAPI only locks in each round's actual pairing
    # shortly before it's played, so a single once-a-day 9am build goes
    # stale by evening: the players are still correct, but who they're
    # actually paired against by kickoff has moved on several rounds.
    # Rebuilding hourly keeps each card's pairing close to what's really
    # about to be played, at the cost of ~24 BetsAPI runs/day instead of 1.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Spin Line
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: python3 spin_line.py

      - name: Commit and push updated slate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d docs/spin-line ] && git add docs/spin-line/ || true
          git diff --staged --quiet || git commit -m "Update Spin Line daily slate"
          git pull --rebase --autostash origin main
          git push
