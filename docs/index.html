<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=spin-line/">
<title>Tabletennis</title>
<style>
  :root{--bg:#0b0f14; --panel:#121820; --border:#233040; --text:#e8edf2; --sub:#8b98a8; --amber:#facc15;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px; max-width:480px; margin:0 auto; display:flex; min-height:100vh; align-items:center; justify-content:center;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px; text-align:center; width:100%;}
  h1{font-size:18px; margin:0 0 8px;}
  p{color:var(--sub); font-size:13px; margin:0 0 16px;}
  a.btn{display:inline-block; background:var(--amber); color:#241c04; font-weight:700; text-decoration:none; padding:10px 20px; border-radius:8px; font-size:14px;}
</style></head>
<body>
  <div class="panel">
    <h1>🏓 Tabletennis</h1>
    <p>Redirecting to Spin Line… if nothing happens, tap below.</p>
    <a class="btn" href="spin-line/">Open Spin Line</a>
  </div>
</body></html>
